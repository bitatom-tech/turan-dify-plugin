identity:
  author: turan
  name: digital_human
  label:
    en_US: Model Tools | AI Virtual Model
    zh_Hans: 模特工具｜AI虚拟模特
description:
  human:
    en_US: Create virtual model images with your preferred age, ethnicity and presentation
      style.
    zh_Hans: 根据年龄、人种与展示要求生成虚拟模特形象，丰富服装与商品展示素材。
  llm: Create virtual model images with your preferred age, ethnicity and presentation
    style.
parameters:
- name: image_1
  type: file
  form: llm
  required: true
  label:
    en_US: Reference Model
    zh_Hans: 参考模特
  human_description:
    en_US: Upload one PNG, JPEG or WebP image, up to 20 MiB.
    zh_Hans: 上传1张图片，支持PNG/JPEG/WebP，单张最多20MiB。
  llm_description: Upload one PNG, JPEG or WebP image, up to 20 MiB.
- name: reference_files
  type: files
  form: llm
  required: false
  label:
    en_US: Reference Image (up to 7 images)
    zh_Hans: 参考图（最多7张）
  human_description:
    en_US: Upload zero to 7 reference images in one list. Images are assigned in the
      displayed order. PNG, JPEG or WebP, up to 20 MiB each.
    zh_Hans: 在同一个入口上传0至7张图片，按列表顺序对应官网图片位置。只补充一张时上传一张即可。支持PNG/JPEG/WebP，单张最多20MiB。
  llm_description: Upload zero to 7 reference images in one list. Images are assigned
    in the displayed order. PNG, JPEG or WebP, up to 20 MiB each.
  min: 0
  max: 7
- name: aspect_ratio
  type: string
  form: llm
  required: false
  label:
    en_US: 'Aspect ratio (default: 1:1)'
    zh_Hans: 尺寸比例（默认 1:1）
  human_description:
    en_US: 'Allowed: 1:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9, auto (automatic).'
    zh_Hans: 可填：1:1、2:3、3:2、3:4、4:3、4:5、5:4、9:16、16:9、21:9、auto（自动）。
  llm_description: 'Allowed: 1:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9,
    auto (automatic).'
  default: '1:1'
  options:
  - value: '1:1'
    label:
      en_US: '1:1'
      zh_Hans: '1:1'
  - value: '2:3'
    label:
      en_US: '2:3'
      zh_Hans: '2:3'
  - value: '3:2'
    label:
      en_US: '3:2'
      zh_Hans: '3:2'
  - value: '3:4'
    label:
      en_US: '3:4'
      zh_Hans: '3:4'
  - value: '4:3'
    label:
      en_US: '4:3'
      zh_Hans: '4:3'
  - value: '4:5'
    label:
      en_US: '4:5'
      zh_Hans: '4:5'
  - value: '5:4'
    label:
      en_US: '5:4'
      zh_Hans: '5:4'
  - value: '9:16'
    label:
      en_US: '9:16'
      zh_Hans: '9:16'
  - value: '16:9'
    label:
      en_US: '16:9'
      zh_Hans: '16:9'
  - value: '21:9'
    label:
      en_US: '21:9'
      zh_Hans: '21:9'
  - value: auto
    label:
      en_US: Automatic
      zh_Hans: auto
- name: requirement_1
  type: string
  form: llm
  required: false
  label:
    en_US: Age
    zh_Hans: 年龄
  human_description:
    en_US: Describe your preferences for age. Keep the default or customize it to
      suit your project.
    zh_Hans: 根据创作需求填写，可保留默认值或自行调整。
  llm_description: Describe your preferences for age. Keep the default or customize
    it to suit your project.
- name: requirement_2
  type: string
  form: llm
  required: false
  label:
    en_US: Ethnicity
    zh_Hans: 人种
  human_description:
    en_US: Describe your preferences for ethnicity. Keep the default or customize
      it to suit your project.
    zh_Hans: 根据创作需求填写，可保留默认值或自行调整。
  llm_description: Describe your preferences for ethnicity. Keep the default or customize
    it to suit your project.
- name: requirement_3
  type: string
  form: llm
  required: false
  label:
    en_US: View Angle and Adjustment Level
    zh_Hans: 展示角度和优化幅度
  human_description:
    en_US: Describe your preferences for view angle and adjustment level. Keep the
      default or customize it to suit your project.
    zh_Hans: 根据创作需求填写，可保留默认值或自行调整。
  llm_description: Describe your preferences for view angle and adjustment level.
    Keep the default or customize it to suit your project.
- name: requirement_4
  type: string
  form: llm
  required: false
  label:
    en_US: Custom Prompt
    zh_Hans: 用户提示词
  human_description:
    en_US: Describe your preferences for custom prompt. Keep the default or customize
      it to suit your project.
    zh_Hans: 生成与图中模特近似长相的模特，相似度为60%。脸蛋再精致一些，欧美皮肤。
  llm_description: Describe your preferences for custom prompt. Keep the default or
    customize it to suit your project.
- name: output_spec
  type: string
  form: llm
  required: false
  label:
    en_US: 'Specification (default: 普通图)'
    zh_Hans: 出图规格（默认 普通图）
  human_description:
    en_US: 'Allowed: 普通图 (Standard Image), 高清图 (HD Image).       Reference prices: Standard Image: 14 coins; HD Image: 25 coins (confirmed at
      submission).'
    zh_Hans: '可填：普通图、高清图。       参考价格：普通图 14 燃币；高清图 25 燃币（以提交时为准）。'
  llm_description: 'Allowed: 普通图 (Standard Image), 高清图 (HD Image).     Reference prices: Standard Image: 14 coins; HD Image: 25 coins (confirmed at submission).'
  default: 普通图
  options:
  - value: 普通图
    label:
      en_US: Standard Image
      zh_Hans: 普通图
  - value: 高清图
    label:
      en_US: HD Image
      zh_Hans: 高清图
output_schema:
  type: object
  properties:
    task_id:
      type: string
    workflow_code:
      type: string
    status:
      type: string
    result_count:
      type: number
extra:
  python:
    source: tools/digital_human.py
