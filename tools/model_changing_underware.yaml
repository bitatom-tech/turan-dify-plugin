    zh_Hans: '可填：普通图。       参考价格：普通图 14 燃币（以提交时为准）。'
  llm_description: 'Allowed: 普通图 (Standard Image).     Reference prices: Standard Image: 14 coins (confirmed at submission).'
  default: 普通图
  options:
  - value: 普通图
    label:
      en_US: Standard Image
      zh_Hans: 普通图
