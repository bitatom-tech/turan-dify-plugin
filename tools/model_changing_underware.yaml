  human_description:
    en_US: Upload one PNG, JPEG or WebP image, up to 20 MiB.
    zh_Hans: 上传1张图片，支持PNG/JPEG/WebP，单张最多20MiB。
  llm_description: Upload one PNG, JPEG or WebP image, up to 20 MiB.
- name: image_2
  type: file
  form: llm
  required: true
  label:
    en_US: Model Image
    zh_Hans: 模特图
  human_description:
    en_US: Upload one PNG, JPEG or WebP image, up to 20 MiB.
    zh_Hans: 上传1张图片，支持PNG/JPEG/WebP，单张最多20MiB。
  llm_description: Upload one PNG, JPEG or WebP image, up to 20 MiB.
- name: requirement_1
  type: string
  form: llm
  required: false
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Describe your preferences for prompt. Keep the default or customize it
